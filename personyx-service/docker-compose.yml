services:
  personyx_db:
    restart: unless-stopped
    image: postgres:12
    container_name: personyx-db
    ports:
      - "5211:5432"
    networks:
      - personyx-net
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../pg12_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ./scripts/postgres-healthcheck.sh:/usr/local/bin/postgres-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/postgres-healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  personyx_bot:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: personyx-service/Dockerfile.bot
    container_name: personyx-bot
    networks:
      - personyx-net
    environment:
      - TZ=Asia/Tokyo
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=${PYTHONPATH}
      - APP_ENV=${APP_ENV}
      - WIF_PRIVATE_KEY_PATH=${WIF_PRIVATE_KEY_PATH}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS_BOT:-/app/bot/credentials/wif-config-prod.json}
      - VERTEXAI_PROJECT_ID=${VERTEXAI_PROJECT_ID}
      - VERTEXAI_LOCATION=${VERTEXAI_LOCATION}
      - DATABASE_URL=${DATABASE_URL}
      - PERSONA_CONF_DIR=${PERSONA_CONF_DIR}
      - PERSONA_CHAT_DIR=${PERSONA_CHAT_DIR}
      - INSTRUCTION_PATH=${INSTRUCTION_PATH}
      - GCP_PROJECT_NUMBER=${GCP_PROJECT_NUMBER}
      - GCP_WIF_POOL_ID=${GCP_WIF_POOL_ID}
      - GCP_WIF_PROVIDER_ID=${GCP_WIF_PROVIDER_ID}
      - GCP_WIF_ISSUER=${GCP_WIF_ISSUER}
      - GCP_WIF_KID=${GCP_WIF_KID}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_SECRET_NAME=${GCP_SECRET_NAME}
    depends_on:
      personyx_db:
        condition: service_healthy
    volumes:
      - ../personyx/bot:/app/bot
      - ../personyx/web:/app/web
      - ../personyx/shared:/app/shared
      - ${HOST_KEY_PATH:-~/.config/gcp/secret/prod/uw_private_key.pem}:/app/secret/uw_private_key.pem:ro
    working_dir: /app/bot

  personyx_web:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: personyx-service/Dockerfile.web
    container_name: personyx-web
    ports:
      - "5000:5000"
    networks:
      - personyx-net
    environment:
      - TZ=Asia/Tokyo
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=${PYTHONPATH}
      - APP_ENV=${APP_ENV}
      - GEN_IMAGES_DIR=/app/gen_images
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
      - DISCORD_AUTH_BASE=${DISCORD_AUTH_BASE}
      - DISCORD_TOKEN_URL=${DISCORD_TOKEN_URL}
      - DISCORD_USER_API=${DISCORD_USER_API}
      - DISCORD_SCOPE=${DISCORD_SCOPE}
      - WIF_PRIVATE_KEY_PATH=${WIF_PRIVATE_KEY_PATH}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS_WEB:-/app/web/credentials/wif-config-prod.json}
      - DATABASE_URL=${DATABASE_URL}
      - GCP_PROJECT_NUMBER=${GCP_PROJECT_NUMBER}
      - GCP_WIF_POOL_ID=${GCP_WIF_POOL_ID}
      - GCP_WIF_PROVIDER_ID=${GCP_WIF_PROVIDER_ID}
      - GCP_WIF_ISSUER=${GCP_WIF_ISSUER}
      - GCP_WIF_KID=${GCP_WIF_KID}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_SECRET_NAME=${GCP_SECRET_NAME}
    depends_on:
      personyx_db:
        condition: service_healthy
    volumes:
      - ../personyx/bot:/app/bot
      - ../personyx/web:/app/web
      - ../personyx/shared:/app/shared
      - ../personyx/web/alembic.ini:/app/web/alembic.ini
      - ../personyx/bot/gen_images:/app/gen_images
      - ${HOST_KEY_PATH:-~/.config/gcp/secret/prod/uw_private_key.pem}:/app/secret/uw_private_key.pem:ro
    working_dir: /app/web
    command: ["sh", "-c", "alembic upgrade head && python app.py"]

networks:
  personyx-net:
    name: "personyx-net"